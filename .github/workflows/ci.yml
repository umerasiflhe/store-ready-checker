name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Commitlint
        # Dependabot's commits are exempted in commitlint.config.mjs; human commits are also
        # linted locally by the commit-msg hook.
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            './README.md' './docs/**/*.md'
          fail: true

      - name: Git hooks self-test
        env:
          LEFTHOOK: '1'
        run: ./scripts/test-git-hooks.sh

  web:
    name: web
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo check
        run: npm run check:repo

      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Rules sync freshness
        run: npx tsx scripts/sync-rules.ts --check

      - name: Rules doc freshness
        run: npx tsx scripts/gen-rules-doc.ts --check

      - name: Web samples freshness
        run: npx tsx scripts/gen-web-samples.ts --check

      - name: Build web app
        run: npm run build

      - name: Size budget
        run: npm run size

  e2e:
    name: e2e
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Playwright
        uses: ./.github/actions/setup-playwright

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  swift:
    name: swift
    timeout-minutes: 30
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: swift-format lint
        run: swift format lint --strict --recursive cli/Sources cli/Tests cli/Package.swift

      - name: Build (warnings as errors)
        run: swift build --package-path cli -Xswiftc -warnings-as-errors

      - name: Swift tests
        run: swift test --package-path cli

  swift-linux:
    # Best effort (brief §8): proves the CLI builds and tests on Linux with the official toolchain,
    # but isn't a required check.
    name: swift-linux
    timeout-minutes: 30
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: swift:6.3.2-noble@sha256:c4336909a71b2e69b884f4078cdf98c0cd081911632cb349ef72abc4cbed69fc
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build --package-path cli

      - name: Swift tests
        run: swift test --package-path cli

  conformance:
    name: conformance
    timeout-minutes: 30
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Conformance
        run: npx tsx scripts/conformance.ts
