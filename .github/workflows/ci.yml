name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -sSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: ./commitlint.config.mjs

      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --exclude covers our own future Pages URL, which 404s until deploy.yml ships it in
          # Milestone 5. Remove the --exclude once that milestone lands.
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude 'https://umerasiflhe\.github\.io/store-ready-checker'
            './README.md' './docs/**/*.md'
          fail: true

      - name: Git hooks self-test
        env:
          LEFTHOOK: '1'
        run: ./scripts/test-git-hooks.sh

  web:
    name: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo check
        run: npm run check:repo

      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Conformance
        run: npx tsx scripts/conformance.ts

      - name: Rules sync freshness
        run: npx tsx scripts/sync-rules.ts --check

      - name: Rules doc freshness
        run: npx tsx scripts/gen-rules-doc.ts --check
