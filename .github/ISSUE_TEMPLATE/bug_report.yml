name: Bug report
description: The checker gave a wrong result, crashed, or misbehaved.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach your `.ipa`, `.aab` or `.apk`.** Attach the JSON report instead
        (web: "Download JSON"; CLI: `storeready check <file> --format json`). It contains no code
        from your app, but review it before posting.
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options: [Web app, Swift CLI, Both]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version and rules version
      description: Both are in the report's `tool` object (e.g. 1.0.0 / 2026.10.23).
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: JSON report
      description: Paste or attach the JSON report. Never the binary.
      render: json
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and OS (web), or macOS/Linux version (CLI). How the build was made (Xcode/AGP version) if relevant.
