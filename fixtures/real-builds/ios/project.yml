# Minimal SwiftUI app built by .github/workflows/real-builds.yml (brief §7.6) to check the checker
# against a real Xcode 26 artifact. XcodeGen turns this into an .xcodeproj at build time, so no
# generated project file is committed.
name: RealBuild
options:
  bundleIdPrefix: io.github.umerasiflhe.storeready
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
targets:
  RealBuild:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.umerasiflhe.storeready.realbuild
